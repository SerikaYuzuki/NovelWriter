# XcodeGen プロジェクト仕様(docs/DECISIONS.md D-008)。
#
# `FUMINIWA.xcodeproj` はこのファイルから生成する生成物であり、
# リポジトリにはコミットしない(.gitignore を参照)。正は常にこのファイル。
#
# 変更したら以下で再生成する:
#   ./Scripts/generate-project.sh
name: FUMINIWA

options:
  bundleIdPrefix: dev.serikayuzuki
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NovelKit:
    path: NovelKit

# Signing.local.xcconfig is an optional, ignored per-developer override. This
# keeps Team selection across XcodeGen regeneration without committing a Team ID.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

schemes:
  FUMINIWA:
    build:
      targets:
        NovelApp: all
    test:
      targets:
        - name: NovelAppTests
      environmentVariables:
        FUMINIWA_TEST_NETWORK_DISABLED: "1"
  FUMINIWAIOS:
    build:
      targets:
        FUMINIWAIOS: all
    test:
      targets:
        - name: FUMINIWAIOSTests
      environmentVariables:
        FUMINIWA_TEST_NETWORK_DISABLED: "1"

targets:
  NovelApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelApp
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelLibrary
      - package: NovelKit
        product: NovelLocalStore
      - package: NovelKit
        product: NovelAuth
      - package: NovelKit
        product: NovelAuthApple
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWA
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # UTType / Document Types と表示名ローカライズを配布契約として管理するため、
        # 物理Info.plistを正とする(D-038)。
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelApp/NovelApp.entitlements
        # コード署名: ローカル実行用に自動署名。CIビルドチェックでは
        # `xcodebuild ... CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO` を
        # 引数で渡して署名なしビルドにする(Scripts/check.sh)。
        CODE_SIGN_STYLE: Automatic
        # App Sandbox は採用しない(docs/DECISIONS.md D-011)。同期はRust serverへ接続する。
        ENABLE_HARDENED_RUNTIME: YES
  NovelAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelAppTests
    dependencies:
      - target: NovelApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/Contents/MacOS/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FUMINIWAIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOS
        excludes:
          - Info.plist
      - path: NovelApp/Features/Writing/AIClipboardPrompt.swift
      - path: NovelApp/DocumentLifecycle/DocumentOperationGate.swift
      - path: NovelApp/DeviceSync/Note/DeviceSyncLog.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelLibrary
      - package: NovelKit
        product: NovelLocalStore
      - package: NovelKit
        product: NovelAuth
      - package: NovelKit
        product: NovelAuthApple
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWAIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa.ios
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelAppIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelAppIOS/FUMINIWAIOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  FUMINIWAIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOSTests
    dependencies:
      - target: FUMINIWAIOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
