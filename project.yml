# XcodeGen プロジェクト仕様(docs/DECISIONS.md D-008)。
#
# `FUMINIWA.xcodeproj` はこのファイルから生成する生成物であり、
# リポジトリにはコミットしない(.gitignore を参照)。正は常にこのファイル。
#
# 変更したら以下で再生成する:
#   ./Scripts/generate-project.sh
name: FUMINIWA

options:
  bundleIdPrefix: dev.serikayuzuki
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

# App-hosted unit tests must not launch a production-composed executable.
# Debug-Test inherits Debug optimization while adding a compile-time
# composition boundary used only by each scheme's Test action. The Debug-
# prefix also keeps Swift package dependencies testable under Xcode.
configs:
  Debug: debug
  Debug-Test: debug
  Release: release

settings:
  configs:
    Debug-Test:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"

packages:
  NovelKit:
    path: NovelKit

# Signing.local.xcconfig is an optional, ignored per-developer override. This
# keeps Team selection across XcodeGen regeneration without committing a Team ID.
configFiles:
  Debug: Config/Signing.xcconfig
  Debug-Test: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

schemes:
  FUMINIWA:
    build:
      targets:
        NovelApp: all
    test:
      config: Debug-Test
      targets:
        - name: NovelAppTests
  FUMINIWAIOS:
    build:
      targets:
        FUMINIWAIOS: all
    test:
      config: Debug-Test
      targets:
        - name: FUMINIWAIOSTests

targets:
  NovelApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelApp
        excludes:
          # Snapshot Sync v2 is the only macOS live sync composition. The
          # retired Device/Note/Work/Cloud paths remain in the checkout for
          # migration evidence, but are not part of FUMINIWA.
          - DeviceSync
          - Application/AppState+SnapshotSync.swift
          - DocumentLifecycle/AppState+Lifecycle.swift
          - DocumentLifecycle/AppState+LifecycleObservers.swift
          - DocumentLifecycle/AppState+Persistence.swift
          - Library
          # The product workbench and feature modules remain live.  The
          # builder is shared from NovelApp/AIClipboardPrompt.swift so the
          # macOS target does not compile a second copy from the historical
          # feature path.
          - Features/Writing/AIClipboardPrompt.swift
          # Package snapshot presenters belong to the retired URL authority;
          # v2 history/restore is provided by AppState+SnapshotSyncV2.
          - Features/ProjectInfo/AppState+Snapshots.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelAuth
      - package: NovelKit
        product: NovelAuthApple
      - package: NovelKit
        product: NovelSyncV2Runtime
      - package: NovelKit
        product: NovelSyncV2PortableBridge
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWA
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # UTType / Document Types と表示名ローカライズを配布契約として管理するため、
        # 物理Info.plistを正とする(D-038)。
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelApp/NovelApp.entitlements
        # コード署名: ローカル実行用に自動署名。CIビルドチェックでは
        # `xcodebuild ... CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO` を
        # 引数で渡して署名なしビルドにする(Scripts/check.sh)。
        CODE_SIGN_STYLE: Automatic
        # App Sandbox は採用しない(docs/DECISIONS.md D-011)。同期はRust serverへ接続する。
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug-Test:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_TEST_COMPOSITION"
  NovelAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelAppTests
        excludes:
          # Retired v1 sync-only tests. Their fixtures remain in the checkout;
          # the live target is covered by SnapshotSyncV2MacTests and the
          # product lifecycle/feature tests below.
          - AppStateSnapshotSyncConflictResolutionTests.swift
          - NoteSyncConflictResolutionViewTests.swift
          - SnapshotSyncConflictProjectionTests.swift
          - StartupCloudLibraryViewTests.swift
          - StartupLibraryProjectionTests.swift
          - WorkConflictResolutionViewTests.swift
    dependencies:
      - target: NovelApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/Contents/MacOS/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug-Test:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_TEST_COMPOSITION"
  FUMINIWAIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOS
        excludes:
          - Info.plist
          # Retired iOS CloudKit / entity-sync live paths.  The files remain
          # in the checkout for migration and fixture recovery, but are not
          # part of the normal FUMINIWAIOS target after v2 cutover.
          - DeviceSync/Conflict
          - DeviceSync/Legacy
          - DeviceSync/Note
          - DeviceSync/Runtime
          - DeviceSync/IOSDocumentStore+SnapshotSync.swift
          - Library/IOSCloudLibraryModels.swift
          - Library/IOSDocumentStore+CloudLibrary.swift
          - Library/IOSDocumentStore+CloudLibraryMutations.swift
          - Library/IOSDocumentStore+CloudLibraryOpen.swift
          - Library/IOSDocumentStore+Library.swift
          - Library/IOSLibraryView.swift
          - Library/IOSProjectHomeView.swift
          - Platform/iOS/IOSWorkChrome.swift
          - DocumentLifecycle/IOSDocumentStore+Lifecycle.swift
          - Features/ProjectInfo/IOSDocumentStore+Snapshots.swift
          - Features/ProjectInfo/IOSSnapshotSheet.swift
          - Features/Writing/IOSWorkbenchView.swift
          - Features/Writing/IOSWritingView.swift
          - Features/Settings/IOSSettingsView.swift
      - path: NovelApp/AIClipboardPrompt.swift
      - path: NovelApp/DocumentLifecycle/DocumentOperationGate.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelAuth
      - package: NovelKit
        product: NovelAuthApple
      - package: NovelKit
        product: NovelSyncV2Runtime
      - package: NovelKit
        product: NovelSyncV2PortableBridge
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWAIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa.ios
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelAppIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelAppIOS/FUMINIWAIOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug-Test:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_TEST_COMPOSITION"
  FUMINIWAIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOSTests
        excludes:
          # These tests exercise the retired package/CloudKit/Note/Work live
          # paths.  Their fixtures remain in the checkout for migration, but
          # the v2 target tests SQLite authority and its safe boundary.
          - IOSDocumentStoreTests.swift
          - IOSDocumentLibraryTests.swift
          - IOSNoteSyncConflictResolutionViewTests.swift
          - IOSWorkConflictResolutionViewTests.swift
    dependencies:
      - target: FUMINIWAIOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug-Test:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_TEST_COMPOSITION"
