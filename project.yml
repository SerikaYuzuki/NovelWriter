# XcodeGen プロジェクト仕様(docs/DECISIONS.md D-008)。
#
# `FUMINIWA.xcodeproj` はこのファイルから生成する生成物であり、
# リポジトリにはコミットしない(.gitignore を参照)。正は常にこのファイル。
#
# 変更したら以下で再生成する:
#   ./Scripts/generate-project.sh
name: FUMINIWA

options:
  bundleIdPrefix: dev.serikayuzuki
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NovelKit:
    path: NovelKit

schemes:
  FUMINIWA:
    build:
      targets:
        NovelApp: all
    test:
      targets:
        - name: NovelAppTests
        - name: NovelAppDeviceSyncTests
  FUMINIWAExperimental:
    build:
      targets:
        FUMINIWAExperimental: all
    test:
      targets:
        - name: FUMINIWAExperimentalTests
  FUMINIWAIOS:
    build:
      targets:
        FUMINIWAIOS: all
    test:
      targets:
        - name: FUMINIWAIOSTests
        - name: FUMINIWADeviceSyncIOSTests

targets:
  NovelApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelApp
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelSyncCloudKit
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWA
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # UTType / Document Types と表示名ローカライズを配布契約として管理するため、
        # 物理Info.plistを正とする(D-038)。
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelApp/NovelApp.entitlements
        # コード署名: ローカル実行用に自動署名。CIビルドチェックでは
        # `xcodebuild ... CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO` を
        # 引数で渡して署名なしビルドにする(Scripts/check.sh)。
        CODE_SIGN_STYLE: Automatic
        # App Sandbox は採用しない(docs/DECISIONS.md D-011)。Device Sync用の
        # CloudKit / Push entitlementだけを持たせ、sandbox entitlementは付与しない。
        ENABLE_HARDENED_RUNTIME: YES
  NovelAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelAppTests
        excludes:
          - DeviceSyncAppIntegrationTests.swift
          - DeviceSyncPersistenceRootTests.swift
          - DeviceSyncEditIntentStoreTests.swift
          - DeviceSyncLocalLibraryStoreTests.swift
          - DeviceSyncCloudLibraryAppTests.swift
    dependencies:
      - target: NovelApp
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/Contents/MacOS/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NovelAppDeviceSyncTests:
    # App hostとtest bundleへDomainを二重linkしないunhosted test module。
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelApp
        excludes:
          - FuminiwaApp.swift
          - Info.plist
          - NovelApp.entitlements
          - Assets.xcassets
          - en.lproj
          - ja.lproj
      - path: NovelAppTests/DeviceSyncAppIntegrationTests.swift
      - path: NovelAppTests/DeviceSyncPersistenceRootTests.swift
      - path: NovelAppTests/DeviceSyncEditIntentStoreTests.swift
      - path: NovelAppTests/DeviceSyncLocalLibraryStoreTests.swift
      - path: NovelAppTests/DeviceSyncCloudLibraryAppTests.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelSyncCloudKit
      - package: NovelKit
        product: NovelSyncTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_UNHOSTED_DEVICE_SYNC_TESTS"
  FUMINIWAExperimental:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelApp
        excludes:
          - Info.plist
          - en.lproj/InfoPlist.strings
          - ja.lproj/InfoPlist.strings
      - path: NovelAppExperimental
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelAI
      - package: NovelKit
        product: NovelSync
    settings:
      base:
        PRODUCT_NAME: FUMINIWAExperimental
        PRODUCT_MODULE_NAME: FUMINIWAExperimental
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa.experimental
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_ENABLE_EXPERIMENTAL_AI"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelAppExperimental/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  FUMINIWAExperimentalTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovelAppExperimentalTests
    dependencies:
      - target: FUMINIWAExperimental
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FUMINIWA_ENABLE_EXPERIMENTAL_AI"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWAExperimental.app/Contents/MacOS/FUMINIWAExperimental"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FUMINIWAIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOS
        excludes:
          - Info.plist
      - path: NovelApp/AIClipboardPrompt.swift
      - path: NovelApp/DocumentOperationGate.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelSyncCloudKit
    settings:
      base:
        PRODUCT_NAME: FUMINIWA
        PRODUCT_MODULE_NAME: FUMINIWAIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.serikayuzuki.fuminiwa.ios
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelAppIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: NovelAppIOS/FUMINIWAIOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  FUMINIWAIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOSTests
        excludes:
          - IOSDeviceSyncIntegrationTests.swift
          - IOSDeviceSyncPersistenceRootTests.swift
          - IOSDeviceSyncEditIntentStoreTests.swift
    dependencies:
      - target: FUMINIWAIOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FUMINIWA.app/FUMINIWA"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FUMINIWADeviceSyncIOSTests:
    # iOSもApp sourceを一度だけcompileするunhosted test module。
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovelAppIOS
        excludes:
          - FuminiwaIOSApp.swift
          - Info.plist
          - FUMINIWAIOS.entitlements
      - path: NovelApp/AIClipboardPrompt.swift
      - path: NovelApp/DocumentOperationGate.swift
      - path: NovelAppIOSTests/IOSDeviceSyncIntegrationTests.swift
      - path: NovelAppIOSTests/IOSDeviceSyncPersistenceRootTests.swift
      - path: NovelAppIOSTests/IOSDeviceSyncEditIntentStoreTests.swift
    dependencies:
      - package: NovelKit
        product: NovelCore
      - package: NovelKit
        product: NovelStorage
      - package: NovelKit
        product: EditorKit
      - package: NovelKit
        product: NovelUI
      - package: NovelKit
        product: NovelExport
      - package: NovelKit
        product: NovelSync
      - package: NovelKit
        product: NovelSyncCloudKit
      - package: NovelKit
        product: NovelSyncTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
