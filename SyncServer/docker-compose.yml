services:
  sync-server:
    build: .
    restart: unless-stopped
    environment:
      FUMINIWA_BIND: 0.0.0.0:8080
      FUMINIWA_DEV_TOKEN: ${FUMINIWA_DEV_TOKEN:?set a development token}
      DATABASE_URL: postgres://fuminiwa:${POSTGRES_PASSWORD:?set a postgres password}@postgres:5432/fuminiwa
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuminiwa
      POSTGRES_USER: fuminiwa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a postgres password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuminiwa -d fuminiwa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
