name: fuminiwa-sync-v2
services:
  postgres:
    image: postgres:16
    container_name: fuminiwa-sync-v2-postgres
    environment:
      POSTGRES_DB: fuminiwa_sync_v2
      POSTGRES_USER: fuminiwa_sync_v2
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - fuminiwa_sync_v2_pgdata:/var/lib/postgresql/data
    secrets:
      - postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuminiwa_sync_v2 -d fuminiwa_sync_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - fuminiwa-sync-v2-net
  server:
    build: .
    container_name: fuminiwa-sync-v2-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FUMINIWA_RUNTIME_MODE: production
      FUMINIWA_SERVER_INSTANCE_ID: ${FUMINIWA_SERVER_INSTANCE_ID:?set a v2-only lowercase UUID}
      FUMINIWA_SYNC_V2_BIND: 0.0.0.0:8092
      FUMINIWA_SYNC_V2_POSTGRES_HOST: postgres
      FUMINIWA_SYNC_V2_POSTGRES_PORT: 5432
      FUMINIWA_SYNC_V2_POSTGRES_DB: fuminiwa_sync_v2
      FUMINIWA_SYNC_V2_POSTGRES_USER: fuminiwa_sync_v2
      FUMINIWA_SYNC_V2_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      FUMINIWA_AUTH_VAULT_KEY_VERSION: ${FUMINIWA_AUTH_VAULT_KEY_VERSION:?set the active vault key version}
      FUMINIWA_AUTH_VAULT_KEY_FILE: /run/secrets/auth-vault-key
      FUMINIWA_AUTH_VAULT_KEYRING_FILE: /run/secrets/auth-vault-keyring
      FUMINIWA_AUTH_SUBJECT_HMAC_KEY_FILE: /run/secrets/auth-subject-hmac-key
      FUMINIWA_AUTH_TOKEN_HMAC_KEY_FILE: /run/secrets/auth-token-hmac-key
      FUMINIWA_APPLE_TEAM_ID: ${FUMINIWA_APPLE_TEAM_ID:?set the Apple Team ID}
      FUMINIWA_APPLE_KEY_ID: ${FUMINIWA_APPLE_KEY_ID:?set the Apple key ID}
      FUMINIWA_APPLE_MAC_CLIENT_ID: ${FUMINIWA_APPLE_MAC_CLIENT_ID:?set the macOS App ID}
      FUMINIWA_APPLE_IOS_CLIENT_ID: ${FUMINIWA_APPLE_IOS_CLIENT_ID:?set the iOS App ID}
      FUMINIWA_APPLE_PRIVATE_KEY_FILE: /run/secrets/apple-sign-in-key.p8
    volumes:
      - ${FUMINIWA_AUTH_VAULT_KEY_HOST_PATH:?set vault key file path}:/run/secrets/auth-vault-key:ro
      - ${FUMINIWA_AUTH_VAULT_KEYRING_HOST_PATH:?set vault keyring file path}:/run/secrets/auth-vault-keyring:ro
      - ${FUMINIWA_AUTH_SUBJECT_HMAC_KEY_HOST_PATH:?set subject HMAC key file path}:/run/secrets/auth-subject-hmac-key:ro
      - ${FUMINIWA_AUTH_TOKEN_HMAC_KEY_HOST_PATH:?set token HMAC key file path}:/run/secrets/auth-token-hmac-key:ro
      - ${FUMINIWA_APPLE_PRIVATE_KEY_HOST_PATH:?set Apple p8 file path}:/run/secrets/apple-sign-in-key.p8:ro
    secrets:
      - postgres-password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /v2/capabilities is authenticated by design.  401 proves that the
      # listener, router and database-backed startup completed; no secret is
      # needed in a container health probe.
      test:
        - CMD-SHELL
        - >-
          code="$$(curl --silent --show-error --output /dev/null
          --write-out '%{http_code}' http://127.0.0.1:8092/v2/capabilities || true)";
          test "$$code" = 200 || test "$$code" = 401
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fuminiwa-sync-v2-net
  edge:
    image: caddy:2.8-alpine
    container_name: fuminiwa-sync-v2-edge
    environment:
      FUMINIWA_SYNC_V2_EDGE_HOST: ${FUMINIWA_SYNC_V2_EDGE_HOST:-192.168.11.5}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${FUMINIWA_SYNC_V2_EDGE_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fuminiwa_sync_v2_caddy_data:/data
      - fuminiwa_sync_v2_caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --no-check-certificate --server-response --spider
          --header "Host: $${FUMINIWA_SYNC_V2_EDGE_HOST}:8443"
          https://127.0.0.1:8443/v2/capabilities 2>&1 |
          grep -Eq 'HTTP/[0-9.]+ (200|401)'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fuminiwa-sync-v2-net
volumes:
  fuminiwa_sync_v2_pgdata:
    name: fuminiwa-sync-v2-data
  fuminiwa_sync_v2_caddy_data:
    name: fuminiwa-sync-v2-caddy-data
  fuminiwa_sync_v2_caddy_config:
    name: fuminiwa-sync-v2-caddy-config
secrets:
  postgres-password:
    file: ${FUMINIWA_SYNC_V2_POSTGRES_PASSWORD_FILE:?set a password file path}
networks:
  fuminiwa-sync-v2-net:
    name: fuminiwa-sync-v2-net
    internal: false
