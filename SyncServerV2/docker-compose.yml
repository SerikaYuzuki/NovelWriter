name: fuminiwa-sync-v2
services:
  postgres:
    image: postgres:16
    container_name: fuminiwa-sync-v2-postgres
    environment:
      POSTGRES_DB: fuminiwa_sync_v2
      POSTGRES_USER: fuminiwa_sync_v2
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - fuminiwa-sync-v2-data:/var/lib/postgresql/data
    secrets:
      - postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuminiwa_sync_v2 -d fuminiwa_sync_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - fuminiwa-sync-v2-net
  server:
    build: .
    container_name: fuminiwa-sync-v2-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FUMINIWA_RUNTIME_MODE: production
      FUMINIWA_SERVER_INSTANCE_ID: ${FUMINIWA_SERVER_INSTANCE_ID:?set a v2-only lowercase UUID}
      FUMINIWA_SYNC_V2_BIND: 0.0.0.0:8092
      FUMINIWA_SYNC_V2_POSTGRES_HOST: postgres
      FUMINIWA_SYNC_V2_POSTGRES_PORT: 5432
      FUMINIWA_SYNC_V2_POSTGRES_DB: fuminiwa_sync_v2
      FUMINIWA_SYNC_V2_POSTGRES_USER: fuminiwa_sync_v2
      FUMINIWA_SYNC_V2_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      FUMINIWA_AUTH_VAULT_KEY_VERSION: ${FUMINIWA_AUTH_VAULT_KEY_VERSION:?set the active vault key version}
      FUMINIWA_AUTH_VAULT_KEY_FILE: /run/secrets/auth-vault-key
      FUMINIWA_AUTH_VAULT_KEYRING_FILE: /run/secrets/auth-vault-keyring
      FUMINIWA_AUTH_SUBJECT_HMAC_KEY_FILE: /run/secrets/auth-subject-hmac-key
      FUMINIWA_AUTH_TOKEN_HMAC_KEY_FILE: /run/secrets/auth-token-hmac-key
      FUMINIWA_APPLE_TEAM_ID: ${FUMINIWA_APPLE_TEAM_ID:?set the Apple Team ID}
      FUMINIWA_APPLE_KEY_ID: ${FUMINIWA_APPLE_KEY_ID:?set the Apple key ID}
      FUMINIWA_APPLE_MAC_CLIENT_ID: ${FUMINIWA_APPLE_MAC_CLIENT_ID:?set the macOS App ID}
      FUMINIWA_APPLE_IOS_CLIENT_ID: ${FUMINIWA_APPLE_IOS_CLIENT_ID:?set the iOS App ID}
      FUMINIWA_APPLE_PRIVATE_KEY_FILE: /run/secrets/apple-sign-in-key.p8
    secrets:
      - postgres-password
      - auth-vault-key
      - auth-vault-keyring
      - auth-subject-hmac-key
      - auth-token-hmac-key
      - apple-sign-in-key.p8
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # The sync capabilities endpoint is authenticated by design and cannot
      # be probed without an access token.  Auth capabilities is intentionally
      # unauthenticated (but version-gated), so it proves the listener and
      # router are ready without embedding a credential in the image.
      test:
        - CMD-SHELL
        - >-
          code="$$(curl --silent --show-error --output /dev/null
          --write-out '%{http_code}'
          --header 'x-fuminiwa-client-version: 0.1.0'
          http://127.0.0.1:8092/v1/auth/capabilities || true)";
          test "$$code" = 200
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fuminiwa-sync-v2-net
  edge:
    image: caddy:2.8-alpine
    container_name: fuminiwa-sync-v2-edge
    environment:
      FUMINIWA_SYNC_V2_EDGE_HOST: ${FUMINIWA_SYNC_V2_EDGE_HOST:-192.168.11.5}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${FUMINIWA_SYNC_V2_EDGE_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - fuminiwa_sync_v2_caddy_data:/data
      - fuminiwa_sync_v2_caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official Caddy image carries cap_net_bind_service on its binary.
    # Docker rejects exec when that file capability is not in the bounding
    # set, even though this staging listener uses an unprivileged port.
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -S --spider http://127.0.0.1:2019/config/ 2>&1 |
          grep -Eq 'HTTP/[0-9.]+ 200'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fuminiwa-sync-v2-net
volumes:
  fuminiwa-sync-v2-data:
    name: fuminiwa-sync-v2-data
  fuminiwa_sync_v2_caddy_data:
    name: fuminiwa-sync-v2-caddy-data
  fuminiwa_sync_v2_caddy_config:
    name: fuminiwa-sync-v2-caddy-config
secrets:
  postgres-password:
    file: ${FUMINIWA_SYNC_V2_POSTGRES_PASSWORD_FILE:?set a password file path}
  auth-vault-key:
    file: ${FUMINIWA_AUTH_VAULT_KEY_HOST_PATH:?set vault key file path}
  auth-vault-keyring:
    file: ${FUMINIWA_AUTH_VAULT_KEYRING_HOST_PATH:?set vault keyring file path}
  auth-subject-hmac-key:
    file: ${FUMINIWA_AUTH_SUBJECT_HMAC_KEY_HOST_PATH:?set subject HMAC key file path}
  auth-token-hmac-key:
    file: ${FUMINIWA_AUTH_TOKEN_HMAC_KEY_HOST_PATH:?set token HMAC key file path}
  apple-sign-in-key.p8:
    file: ${FUMINIWA_APPLE_PRIVATE_KEY_HOST_PATH:?set Apple p8 file path}
networks:
  fuminiwa-sync-v2-net:
    name: fuminiwa-sync-v2-net
    internal: false
