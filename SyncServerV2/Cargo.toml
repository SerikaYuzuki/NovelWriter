[package]
name = "fuminiwa-sync-server-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "FUMINIWA Snapshot Sync v2 server"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
hex = "0.4"
getrandom = "0.2"
hmac = "0.12"
http = "1"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
tower = "0.5"
