    HistoryReason:
      type: string
      enum:
        - autoUnion
        - conflictResolution
        - keepBothCloneRoot
        - lifecycleCheckpoint
        - manualCheckpoint
        - published
        - restoreBefore
        - snapshotRestore
      description: Server-recorded occurrence class; an unacknowledged local capture may remain local metadata.
    HistoryEntry:
      type: object
      additionalProperties: false
      required:
        - available
        - occurrenceId
        - parentSnapshotIds
        - pinned
        - reason
        - recordedAt
        - snapshotId
        - userReleasedPayload
      properties:
        available:
          type: boolean
          description: True only while the exact canonical manifest payload and complete entry-reference set are retained.
        occurrenceId:
          $ref: '#/components/schemas/OccurrenceId'
          description: Server-generated immutable identity of this occurrence; exact receipt replay preserves it.
        parentSnapshotIds:
          type: array
          minItems: 0
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SnapshotId'
          x-fuminiwa-ordering: lowercase SnapshotID ascending
        pinned:
          type: boolean
          description: Effective payload-retention pin state represented by this occurrence result/page.
        reason:
          $ref: '#/components/schemas/HistoryReason'
        recordedAt:
          $ref: '#/components/schemas/ServerTimestamp'
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        userReleasedPayload:
          type: boolean
          description: |
            Durable current Snapshot-level release marker reflected on this occurrence.
            True means explicit release overrode automatic buckets and schedulers MUST
            NOT re-materialize the payload. Explicit exact-manifest registration may
            clear it for all occurrences of the Snapshot.
      description: |
        One retained occurrence, not a unique Snapshot row. The same SnapshotID may
        appear multiple times. `occurrenceId` uniquely identifies and reads back each
        one. In History list pages, available, pinned, and userReleasedPayload are the
        complete current Snapshot state. Inside an immutable operation receipt they
        are the effective state at first execution and replay historically unchanged;
        change-stream catch-up refetches the list as current authority. `recordedAt` is display metadata; stable pagination and retention use the
        server occurrence sequence, with occurrenceId UTF-8 bytes as the deterministic
        final tie-break, never wall-clock order.
    HistoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/HistoryEntry'
        page:
          oneOf:
            - $ref: '#/components/schemas/FinalPageMarker'
            - $ref: '#/components/schemas/MorePageMarker'
          discriminator:
            propertyName: state
      description: |
        Items use descending immutable server occurrence sequence and occurrenceId
        UTF-8 bytes as final deterministic tie-break. Page tokens preserve that stable
        view; recordedAt never drives order or pagination.
    RecordSnapshotCheckpointCommand:
      type: object
      additionalProperties: false
      required: [ensurePinned, operationId, reason, snapshotId, workId]
      properties:
        ensurePinned:
          type: boolean
          description: True guarantees a pin; false preserves the existing pin state and never unpins.
        operationId:
          $ref: '#/components/schemas/OperationId'
        reason:
          type: string
          enum: [lifecycleCheckpoint, manualCheckpoint]
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        workId:
          $ref: '#/components/schemas/WorkId'
      description: |
        Exact canonical checkpoint command. WorkID and SnapshotID MUST byte-match the
        route. The field is always explicit; clients default manualCheckpoint to
        ensurePinned=true. Manual reason by itself is not a payload root. The server
        computes the command digest; no requestDigest input exists.
    RecordSnapshotCheckpointResult:
      type: object
      additionalProperties: false
      required: [commandDigest, historyEntry, operationId, outcome, workId]
      properties:
        commandDigest:
          $ref: '#/components/schemas/CommandDigest'
        historyEntry:
          $ref: '#/components/schemas/HistoryEntry'
        operationId:
          $ref: '#/components/schemas/OperationId'
        outcome:
          type: string
          const: checkpointRecorded
        workId:
          $ref: '#/components/schemas/WorkId'
      description: |
        `historyEntry.available` is true, `userReleasedPayload` is false, its
        SnapshotID/reason equal the command, and
        its `pinned` is the effective state at first execution after applying
        ensurePinned without an implicit unpin. `recordedAt` is fixed by that receipt
        execution, and `occurrenceId` is the immutable read-back identity. The Work head
        is unchanged; later setSnapshotPin changes do not mutate the stored response on
        exact replay.
    SetSnapshotPinCommand:
      type: object
      additionalProperties: false
      required: [operationId, pinned, snapshotId, workId]
      properties:
        operationId:
          $ref: '#/components/schemas/OperationId'
        pinned:
          type: boolean
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        workId:
          $ref: '#/components/schemas/WorkId'
    SetSnapshotPinResult:
      type: object
      additionalProperties: false
      required: [commandDigest, operationId, pinned, snapshotId, workId]
      properties:
        commandDigest:
          $ref: '#/components/schemas/CommandDigest'
        operationId:
          $ref: '#/components/schemas/OperationId'
        pinned:
          type: boolean
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        workId:
          $ref: '#/components/schemas/WorkId'
    ReleaseSnapshotPayloadCommand:
      type: object
      additionalProperties: false
      required: [operationId, snapshotId, workId]
      properties:
        operationId:
          $ref: '#/components/schemas/OperationId'
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        workId:
          $ref: '#/components/schemas/WorkId'
      description: |
        Exact canonical command. WorkID and SnapshotID MUST byte-match the route. The
        server computes the command digest; no requestDigest input exists.
    ReleaseSnapshotPayloadResult:
      type: object
      additionalProperties: false
      required:
        - available
        - commandDigest
        - operationId
        - outcome
        - quotaCanonicalManifestBytesRemoved
        - snapshotId
        - userReleasedPayload
        - workId
      properties:
        available:
          type: boolean
          const: false
        commandDigest:
          $ref: '#/components/schemas/CommandDigest'
        operationId:
          $ref: '#/components/schemas/OperationId'
        outcome:
          type: string
          enum: [alreadyUnavailable, released]
        quotaCanonicalManifestBytesRemoved:
          type: integer
          minimum: 0
          maximum: 50331648
          description: |
            Exact formerly available canonical manifest bytes for released, and zero
            for alreadyUnavailable. Exact receipt replay returns the stored value and
            performs no additional quota subtraction.
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        userReleasedPayload:
          type: boolean
          const: true
        workId:
          $ref: '#/components/schemas/WorkId'
      allOf:
        - oneOf:
            - required: [outcome, quotaCanonicalManifestBytesRemoved]
              properties:
                outcome:
                  const: alreadyUnavailable
                quotaCanonicalManifestBytesRemoved:
                  const: 0
            - required: [outcome, quotaCanonicalManifestBytesRemoved]
              properties:
                outcome:
                  const: released
                quotaCanonicalManifestBytesRemoved:
                  minimum: 1
      description: |
        `released` means the canonical manifest and entry payload root were removed in the receipt transaction;
        `alreadyUnavailable` means it was already a lineage stub. Both outcomes leave
        the durable userReleasedPayload marker true. Neither removes graph metadata or
        History occurrences, and no automatic retention task may reverse the release.
    QuotaState:
      type: object
      additionalProperties: false
      required:
        - limitBytes
        - maxAttachmentObjectBytes
        - maxStructuredObjectBytes
        - remainingBytes
        - reservedUploadBytes
        - usedCanonicalManifestBytes
        - usedFinalizedObjectBytes
      properties:
        limitBytes:
          type: integer
          const: 5368709120
        maxAttachmentObjectBytes:
          type: integer
          const: 262144000
        maxStructuredObjectBytes:
          type: integer
          const: 16777216
        remainingBytes:
          type: integer
          minimum: 0
          maximum: 5368709120
        reservedUploadBytes:
          type: integer
          minimum: 0
          maximum: 5368709120
          description: |
            Sum of exactly-once reservations for upload rows currently in open state
            only. Each concurrent upload has one reservation; duplicate-ObjectID
            finalize losers and invalid-byte finalizes release their own reservation
            in the same terminal receipt transaction.
        usedCanonicalManifestBytes:
          type: integer
          minimum: 0
          maximum: 5368709120
          description: Exact canonical manifest bytes for available Snapshot payloads only; lineage stubs are uncharged.
        usedFinalizedObjectBytes:
          type: integer
          minimum: 0
          maximum: 5368709120
      description: |
        `remainingBytes = max(0, limitBytes - usedCanonicalManifestBytes -
        usedFinalizedObjectBytes - reservedUploadBytes)`. usedFinalizedObjectBytes
        charges each tenant/ObjectID current available incarnation once, never once per
        upload session or finalize receipt.

    RestoreSnapshotCommand:
      type: object
      additionalProperties: false
      required:
        - expectedHead
        - operationId
        - restoreSnapshotId
        - selectedSnapshotId
        - workId
      properties:
        expectedHead:
