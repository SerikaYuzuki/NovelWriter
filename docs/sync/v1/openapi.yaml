    SnapshotManifest:
      type: object
      additionalProperties: false
      required: [entries, parentSnapshotIds, schemaVersion, workId]
      properties:
        entries:
          type: array
          minItems: 9
          maxItems: 100000
          items:
            $ref: '#/components/schemas/SnapshotEntry'
          allOf:
            - $ref: '#/components/schemas/HasWorkDocument'
            - $ref: '#/components/schemas/HasWorkTitle'
            - $ref: '#/components/schemas/HasWorkSynopsis'
            - $ref: '#/components/schemas/HasWorkChapterOrder'
            - $ref: '#/components/schemas/HasWorkCharacterOrder'
            - $ref: '#/components/schemas/HasWorkPlotCardOrder'
            - $ref: '#/components/schemas/HasWorkFlagOrder'
            - $ref: '#/components/schemas/HasWorkWorldNoteOrder'
            - $ref: '#/components/schemas/HasWorkAttachmentOrder'
          x-fuminiwa-ordering: entityKey ascending by exact UTF-8 bytes; entityKey unique
        parentSnapshotIds:
          type: array
          minItems: 0
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SnapshotId'
          x-fuminiwa-ordering: lowercase SnapshotID ascending
        schemaVersion:
          type: integer
          const: 1
        workId:
          $ref: '#/components/schemas/WorkId'
      description: |
        JSON Schema validates the closed wire shape and nine mandatory work keys.
        Registration additionally enforces all declared whole-work closure rules.
      x-fuminiwa-semantic-invariants:
        mandatoryWorkKeys:
          - work/attachment-order
          - work/chapter-order
          - work/character-order
          - work/document
          - work/flag-order
          - work/plot-card-order
          - work/synopsis
          - work/title
          - work/world-note-order
        closureRules:
          - Every chapter-order ID has exactly chapter/{id}/title and chapter/{id}/episode-order.
          - Every EpisodeID occurs in exactly one chapter episode-order and has title, body, and memo entries.
          - Each character, plot-card, flag, and world-note order is an exact bijection with its typed entities.
          - Each attachment-order ID has exactly one metadata entry and one bytes entry.
          - attachment/{id}/bytes uses application/octet-stream; every other v1 EntityKey uses application/vnd.fuminiwa.entity+json;version=1.
          - Attachment metadata carries no media/MIME identity; UI OS inference is asynchronous and is never hashed or synchronized.
          - Every structured reference targets an entity inside the same WorkID closure.
          - No typed domain entity exists outside the closure declared by mandatory order entries.
        attachmentFilenameRules:
          - displayName is one original filename component, never a path, dot, or dot-dot; it is 1 through 255 UTF-8 bytes and at most 240 UTF-16 code units before normalization.
          - Characters U+0000 through U+001F, U+007F, less-than, greater-than, colon, double quote, slash, backslash, vertical bar, question mark, and asterisk are forbidden.
          - A trailing U+0020 space or period is forbidden.
          - For every extension sequence, the collision-key basename before the first period is not CON, PRN, AUX, NUL, COM1 through COM9, LPT1 through LPT9, COM followed by superscript 1, 2, or 3, or LPT followed by superscript 1, 2, or 3.
          - CollisionKey is NFC_15.1(original), then Unicode 15.1.0 Default Full Case Folding from CaseFolding.txt status C and F only with Turkic T excluded, then NFC_15.1; equality compares result UTF-8 bytes.
          - R0 clients and server use the vendored generated table and Unicode source hashes advertised by portableNamePolicy; OS locale, Foundation, .NET, Rust standard library, and ambient ICU behavior are forbidden as authority.
          - Distinct attachment IDs have distinct displayName CollisionKeys in the projected attachment directory.
          - A safe union that would create a filename collision is needsChoice with portableFilenameCollision, never silent rename or overwrite.
        portableV3ProjectionRules:
          - The known synchronized model losslessly projects through the current v3 writer before Snapshot registration succeeds.
          - Every original path component is at most 255 UTF-8 bytes and 240 UTF-16 code units; every relative path joined with one U+002F separator is at most 768 UTF-8 bytes and 512 UTF-16 code units; projected package depth is at most 16.
          - Projected file-plus-directory item count is at most 20000 and total exact bytes at most 2147483648.
          - Every value encoded by string-value.schema.json, including titles, synopsis, episode body, and episode memo, and each world-note content value is at most 1048576 raw UTF-8 bytes; generated known-JSON aggregate caps also apply.
          - Each generated known JSON data file other than manifest is at most 67108864 bytes; generated manifest.json is at most 16777216 bytes.
          - Each attachment is at most 262144000 bytes and must satisfy the portable filename and path validator.
          - Portable projection limits are whole-work semantic caps beyond the manifest schema and are independent of account quota.
        workDocumentRules:
          - documentCreatedAt is a calendar-valid RFC 3339 instant in exact YYYY-MM-DDTHH:MM:SSZ form, year 0001 through 9999, with no leap second.
          - Regex matching is only a lexical prefilter; failed calendar or format assertion is schemaViolation.
          - The first accepted Snapshot registration for a previously unseen WorkID establishes its work/document ObjectID anchor.
          - Every later Snapshot under that WorkID, including a parentless migration candidate, exactly matches the anchor; parented Snapshots also match every parent.
          - A work/document ObjectID change after the anchor exists is lineageViolation and cannot be registered or published.
          - A zero-parent root for a previously unused WorkID may reuse another WorkID's existing work/document object and establishes its own anchor.
    RegisterSnapshotResult:
      type: object
      additionalProperties: false
      required: [available, outcome, quotaCanonicalManifestBytesAdded, snapshotId, userReleasedPayload, workId]
      properties:
        available:
          type: boolean
          const: true
        outcome:
          type: string
          enum: [alreadyPresent, stored]
          description: |
            `alreadyPresent` means the exact manifest and available entry-reference set
            already existed. `stored` covers first materialization or re-materializing
            a retained lineage stub from the exact same manifest bytes. Successful
            explicit re-materialization clears the Snapshot's userReleasedPayload
            marker; no automatic retention task can perform that transition.
        quotaCanonicalManifestBytesAdded:
          type: integer
          minimum: 0
          maximum: 50331648
          description: |
            Exact canonical request byte count for stored, and zero for alreadyPresent.
            It is the usedCanonicalManifestBytes delta of this transaction; a
            response-loss repeat returns alreadyPresent and cannot add it again.
        snapshotId:
          $ref: '#/components/schemas/SnapshotId'
        userReleasedPayload:
          type: boolean
          const: false
          description: Explicit successful materialization clears any prior user-release marker.
        workId:
          $ref: '#/components/schemas/WorkId'
      allOf:
        - oneOf:
            - required: [outcome, quotaCanonicalManifestBytesAdded]
              properties:
                outcome:
                  const: alreadyPresent
                quotaCanonicalManifestBytesAdded:
                  const: 0
            - required: [outcome, quotaCanonicalManifestBytesAdded]
              properties:
                outcome:
                  const: stored
                quotaCanonicalManifestBytesAdded:
                  minimum: 1

