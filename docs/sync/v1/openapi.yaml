      additionalProperties: false
      required: [code, minimumClientVersion, requestId, retryability]
      properties:
        code:
          type: string
          const: clientVersionUnsupported
        minimumClientVersion:
          $ref: '#/components/schemas/SemanticVersion'
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: afterClientUpgrade
    ResourceNotFoundError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          enum:
            - bootstrapNotFound
            - conflictNotFound
            - divergenceNotFound
            - objectNotFound
            - snapshotNotFound
            - uploadNotFound
            - workNotFound
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    CursorExpiredError:
      type: object
      additionalProperties: false
      required: [bootstrapRequired, code, requestId, retryability]
      properties:
        bootstrapRequired:
          type: boolean
          const: true
        code:
          type: string
          const: cursorExpired
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: afterBootstrap
    BootstrapExpiredError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          const: bootstrapExpired
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: afterBootstrap
    OperationIdReusedError:
      type: object
      additionalProperties: false
      required:
        - code
        - incomingCommandKind
        - incomingCommandDigest
        - originalCommandKind
        - originalCommandDigest
        - operationId
        - requestId
        - retryability
      properties:
        code:
          type: string
          const: operationIdReused
        incomingCommandKind:
          $ref: '#/components/schemas/ReceiptCommandKind'
        incomingCommandDigest:
          $ref: '#/components/schemas/CommandDigest'
        operationId:
          $ref: '#/components/schemas/OperationId'
        originalCommandKind:
          $ref: '#/components/schemas/ReceiptCommandKind'
        originalCommandDigest:
          $ref: '#/components/schemas/CommandDigest'
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    CommandStateConflictError:
      type: object
      additionalProperties: false
      required: [code, recoveryAction, requestId, retryability]
      properties:
        code:
          type: string
          enum:
            - bootstrapPageTokenOutOfSequence
            - newWorkAlreadyExists
            - conflictAlreadyResolved
            - divergenceAlreadyClassified
            - snapshotUnavailable
            - uploadAlreadyFinalized
        recoveryAction:
          type: string
          enum:
            - chooseAvailableSnapshot
            - readConflict
            - readDivergence
            - reserveAnotherWorkId
            - restartBootstrap
            - verifyObjectPresence
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
      allOf:
        - oneOf:
            - required: [code, recoveryAction]
              properties:
                code:
                  const: bootstrapPageTokenOutOfSequence
                recoveryAction:
                  const: restartBootstrap
            - required: [code, recoveryAction]
              properties:
                code:
                  const: newWorkAlreadyExists
                recoveryAction:
                  const: reserveAnotherWorkId
            - required: [code, recoveryAction]
              properties:
                code:
                  const: conflictAlreadyResolved
                recoveryAction:
                  const: readConflict
            - required: [code, recoveryAction]
              properties:
                code:
                  const: divergenceAlreadyClassified
                recoveryAction:
                  const: readDivergence
            - required: [code, recoveryAction]
              properties:
                code:
                  const: snapshotUnavailable
                recoveryAction:
                  const: chooseAvailableSnapshot
            - required: [code, recoveryAction]
              properties:
                code:
                  const: uploadAlreadyFinalized
                recoveryAction:
                  const: verifyObjectPresence
      description: |
        The exact request is terminal. code and recoveryAction are a fixed pair; the
        next action is a read or a newly sealed command and never mutation/retry of the
        old operation.
    UploadExpiredError:
      type: object
      additionalProperties: false
      required: [code, expiredUploadId, recoveryAction, requestId, retryability, uploadState]
      properties:
        code:
          type: string
          const: uploadExpired
        expiredUploadId:
          $ref: '#/components/schemas/UploadId'
        recoveryAction:
          type: string
          const: createReplacementUpload
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
        uploadState:
          type: string
          const: expired
      description: |
        The same upload session and, for finalize, the same receipted command are
        terminal. The open reservation was released exactly once by the expiry
        transaction. The client retires expiredUploadId, rechecks current binding-scope
        object presence, then seals a distinct createObjectUpload operationId and
        reservation if still missing. Temporary cleanup failure never reopens the row.
    FinalizeObjectRejectedError:
      type: object
      additionalProperties: false
      required:
        - code
        - commandDigest
        - expiredUploadId
        - operationId
        - recoveryAction
        - requestId
        - retryability
        - uploadState
      properties:
        code:
          type: string
          enum: [hashMismatch, sizeMismatch]
        commandDigest:
          $ref: '#/components/schemas/CommandDigest'
        expiredUploadId:
          $ref: '#/components/schemas/UploadId'
        operationId:
          $ref: '#/components/schemas/OperationId'
        recoveryAction:
          type: string
          const: createReplacementUpload
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
        uploadState:
          type: string
          const: expired
      description: |
        Finalize read-back found wrong bytes. The terminal receipt transaction changed
        the open upload row to expired with validationRejected cause, released its
        reservation exactly once, and committed temporary/planned cleanup intent plus
        quotaChanged. Exact replay returns this body and performs no quota mutation.
        Recheck current object presence, then seal a replacement create operation.
    ObjectAvailabilityChangedError:
      type: object
      additionalProperties: false
      required: [code, recoveryAction, requestId, retryability]
      properties:
        code:
          type: string
          const: objectAvailabilityChanged
        recoveryAction:
          type: string
          const: replanObjectTransfer
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
      description: |
        At least one manifest object observed earlier reached the `deleting` lifecycle
        state before registration or checkpoint recording acquired its locks.
        Registration commits no Snapshot or partial entry-reference set; checkpoint
        recording commits no occurrence or pin change. Do not blindly retry the exact
        request: query the manifest descriptors through findMissingObjects,
        upload/finalize any absence, and re-register the exact manifest. A receipted
        checkpoint then uses a new operationId. ObjectID remains unchanged when a fresh
        physical incarnation is adopted.
    WorkHeadRequiredError:
      type: object
      additionalProperties: false
      required: [code, recoveryAction, requestId, retryability]
      properties:
        code:
          type: string
          const: workHeadRequired
        recoveryAction:
          type: string
          const: publishCurrentHeadFirst
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
      description: |
        recordSnapshotCheckpoint never creates or temporarily substitutes a Work head.
        Publish and read back the current root, then seal a new checkpoint operationId;
        exact replay of this terminal receipt remains workHeadRequired.
    SnapshotPayloadProtectionReason:
      type: string
      enum:
        - currentHead
        - effectivePin
        - migrationSource
        - openConflictSource
        - openDivergenceSource
        - pendingCheckpoint
        - pendingCommand
        - resolvedConflictRetention
        - restoreInProgress
    SnapshotPayloadProtectedError:
      type: object
      additionalProperties: false
      required: [code, protectionReasons, recoveryAction, requestId, retryability]
      properties:
        code:
          type: string
          const: snapshotPayloadProtected
        protectionReasons:
          type: array
          minItems: 1
          maxItems: 9
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SnapshotPayloadProtectionReason'
          x-fuminiwa-ordering: enum value ascending by exact UTF-8 bytes
          description: Complete protection-reason classes observed in the failed lock transaction.
        recoveryAction:
          type: string
          const: resolveSnapshotPayloadProtection
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
      description: |
        No availability, reference, occurrence, pin, or quota state changed. The exact
        receipted command is terminal. Inspect the closed reason set, remove or wait for
        every protection through its owning workflow, then seal a new release command.
    LimitExceededError:
      type: object
      additionalProperties: false
      required: [code, limit, limitName, observed, requestId, retryability]
      properties:
        code:
          type: string
          const: limitExceeded
        limit:
          $ref: '#/components/schemas/SafeInteger'
        limitName:
          type: string
          enum:
            - attachmentObjectBytes
            - canonicalCommandBytes
            - canonicalManifestBytes
            - manifestEntries
            - missingObjectBatch
            - parentSnapshots
            - portableComponentUtf8Bytes
            - portableComponentUtf16CodeUnits
            - portableKnownJsonBytes
            - portableManifestBytes
            - portablePackageDepth
            - portableRelativePathUtf8Bytes
            - portableRelativePathUtf16CodeUnits
            - stringValueRawUtf8Bytes
            - portableWorkBytes
            - portableWorkItems
            - structuredObjectBytes
        observed:
          $ref: '#/components/schemas/SafeInteger'
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    SemanticValidationError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          enum:
            - classificationMismatch
            - contentTypeMismatch
            - dependencyClosureMismatch
            - entityKeyOrderInvalid
            - lineageViolation
            - objectDescriptorMismatch
            - objectNotFinalized
            - parentOrderInvalid
            - portableFilenameViolation
            - portableProjectionViolation
            - restoreContentMismatch
            - schemaViolation
            - snapshotInvariantViolation
            - snapshotIdMismatch
            - workIdMismatch
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    QuotaExceededError:
      type: object
      additionalProperties: false
      required:
        - code
        - limitBytes
        - requestId
        - requestedAdditionalBytes
        - retryability
        - usedAndReservedBytes
      properties:
        code:
          type: string
          const: quotaExceeded
        limitBytes:
          type: integer
          const: 5368709120
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        requestedAdditionalBytes:
          $ref: '#/components/schemas/SafeInteger'
        retryability:
          type: string
          const: afterUserAction
        usedAndReservedBytes:
          $ref: '#/components/schemas/SafeInteger'
    RateLimitedError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryAfterSeconds, retryability]
      properties:
        code:
          type: string
          const: rateLimited
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        retryability:
          type: string
          const: afterBackoff
    TemporarilyUnavailableError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryAfterSeconds, retryability]
      properties:
        code:
          type: string
          const: temporarilyUnavailable
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        retryability:
          type: string
          const: afterBackoff
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/InvalidRequestError'
        - $ref: '#/components/schemas/AuthenticationError'
        - $ref: '#/components/schemas/AccessDeniedError'
        - $ref: '#/components/schemas/FenceMismatchError'
        - $ref: '#/components/schemas/ClientUpgradeError'
        - $ref: '#/components/schemas/ResourceNotFoundError'
        - $ref: '#/components/schemas/CursorExpiredError'
        - $ref: '#/components/schemas/BootstrapExpiredError'
        - $ref: '#/components/schemas/OperationIdReusedError'
        - $ref: '#/components/schemas/CommandStateConflictError'
        - $ref: '#/components/schemas/UploadExpiredError'
        - $ref: '#/components/schemas/FinalizeObjectRejectedError'
        - $ref: '#/components/schemas/ObjectAvailabilityChangedError'
        - $ref: '#/components/schemas/WorkHeadRequiredError'
        - $ref: '#/components/schemas/SnapshotPayloadProtectedError'
        - $ref: '#/components/schemas/LimitExceededError'
        - $ref: '#/components/schemas/SemanticValidationError'
        - $ref: '#/components/schemas/QuotaExceededError'
        - $ref: '#/components/schemas/RateLimitedError'
        - $ref: '#/components/schemas/TemporarilyUnavailableError'

  responses:
    BadRequest:
      description: Request syntax, query, identifier, media type, or exact JCS validation failed.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidRequestError'
              - $ref: '#/components/schemas/LimitExceededError'
    Unauthorized:
      description: Missing, expired, revoked, or otherwise unusable FUMINIWA access token; Apple tokens are rejected.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            const: 'Bearer realm="fuminiwa-sync", token_type="access"'
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/AuthenticationError'
    Forbidden:
      description: Authenticated principal lacks access; resource existence is not disclosed.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/AccessDeniedError'
    FenceConflict:
      description: Server instance, protocol epoch, or account fence does not match.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/FenceMismatchError'
    CommandConflict:
      description: Operation replay mismatch, tenant fence mismatch, or immutable command-state conflict.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationIdReusedError'
              - $ref: '#/components/schemas/CommandStateConflictError'
              - $ref: '#/components/schemas/UploadExpiredError'
              - $ref: '#/components/schemas/FenceMismatchError'
    SnapshotRegistrationConflict:
      description: |
        Tenant fence mismatch, or a referenced object's GC lifecycle changed before
        the all-or-none registration transaction acquired its locks.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FenceMismatchError'
              - $ref: '#/components/schemas/ObjectAvailabilityChangedError'
    CheckpointConflict:
      description: |
        Operation receipt mismatch, tenant fence mismatch, or checkpoint object
        availability changed before the all-or-none occurrence transaction locked it.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationIdReusedError'
              - $ref: '#/components/schemas/FenceMismatchError'
              - $ref: '#/components/schemas/ObjectAvailabilityChangedError'
              - $ref: '#/components/schemas/WorkHeadRequiredError'
    SnapshotPayloadReleaseConflict:
      description: |
        Operation receipt mismatch, tenant fence mismatch, or the Snapshot is a hard
        payload root. Every outcome commits no partial release.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/OperationIdReusedError'
              - $ref: '#/components/schemas/FenceMismatchError'
              - $ref: '#/components/schemas/SnapshotPayloadProtectedError'
    NotFound:
      description: Tenant-owned resource does not exist or is not visible to this principal.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/ResourceNotFoundError'
    Gone:
      description: Opaque cursor or bootstrap session expired and cannot be resumed.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CursorExpiredError'
              - $ref: '#/components/schemas/BootstrapExpiredError'
    PayloadTooLarge:
      description: Raw or canonical request exceeds a fixed named protocol limit.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/LimitExceededError'
    UnprocessableEntity:
      description: Closed schema passed but content, lineage, finalized-object, restore, or quota validation failed.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SemanticValidationError'
              - $ref: '#/components/schemas/QuotaExceededError'
    FinalizeUnprocessableEntity:
      description: |
        Finalize command semantics failed, or read-back rejected the temporary bytes
        and atomically released that upload reservation.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FinalizeObjectRejectedError'
              - $ref: '#/components/schemas/SemanticValidationError'
              - $ref: '#/components/schemas/LimitExceededError'
    UpgradeRequired:
      description: Client is below the minimum version for this protocol epoch.
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/ClientUpgradeError'
    TooManyRequests:
      description: Tenant/principal request rate exceeded; retry only after the advertised delay.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3600
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
    ServiceUnavailable:
      description: Temporary server dependency or maintenance failure; local editing remains valid.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 3600
      content:
        application/vnd.fuminiwa.sync.v1+jcs:
          schema:
            $ref: '#/components/schemas/TemporarilyUnavailableError'
