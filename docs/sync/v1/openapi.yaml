        operationId:
          $ref: '#/components/schemas/OperationId'
        outcome:
          type: string
          const: stale
        protectedRestoreBeforeOccurrenceId:
          type: 'null'
          description: Null because stale CAS commits no restoreBefore occurrence.
        protectedRestoreBeforeSnapshotId:
          type: 'null'
          description: Null because stale CAS commits no restoreBefore occurrence or pin.
      description: Stale CAS creates neither restoreBefore nor snapshotRestore History occurrence.
    RestoreSnapshotResult:
      oneOf:
        - $ref: '#/components/schemas/RestoreSnapshotAppliedResult'
        - $ref: '#/components/schemas/RestoreSnapshotStaleResult'
      discriminator:
        propertyName: outcome
        mapping:
          restored: '#/components/schemas/RestoreSnapshotAppliedResult'
          stale: '#/components/schemas/RestoreSnapshotStaleResult'

    Retryability:
      type: string
      enum:
        - afterAuthentication
        - afterBackoff
        - afterBootstrap
        - afterClientUpgrade
        - afterUserAction
        - never
      description: |
        Machine-actionable recovery class. `afterBackoff` permits the same request only
        after the response Retry-After delay. `afterAuthentication` and
        `afterClientUpgrade` permit retry after repairing that prerequisite.
        `afterBootstrap` requires a fresh bootstrap and reconstruction from its new
        fence/cursor; it does not promise that an expired URI or cursor becomes valid.
        `afterUserAction` is a terminal receipted command; after the user changes state,
        the client seals a new operationId. `never` forbids blind/direct retry from the
        error alone. A typed recoveryAction may authorize a prerequisite read/transfer
        workflow and then a newly sealed operation. For non-receipted idempotent
        Snapshot registration only, replanObjectTransfer may culminate in a new attempt
        using the same immutable manifest bytes after object state has changed.
    ReceiptCommandKind:
      type: string
      enum:
        - classifyDivergence
        - createObjectUpload
        - finalizeObjectUpload
        - publishWorkHead
        - recordSnapshotCheckpoint
        - releaseSnapshotPayload
        - resolveConflict
        - restoreSnapshotContent
        - setSnapshotPin
    InvalidRequestError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          enum:
            - invalidIdentifier
            - invalidQuery
            - invalidRequest
            - nonCanonicalJson
            - unsafeInteger
            - unknownField
            - unsupportedMediaType
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    AuthenticationError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          enum: [accessTokenExpired, authenticationRequired, sessionRevoked]
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: afterAuthentication
    AccessDeniedError:
      type: object
      additionalProperties: false
      required: [code, requestId, retryability]
      properties:
        code:
          type: string
          const: accessDenied
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: never
    FenceMismatchError:
      type: object
      additionalProperties: false
      required:
        - code
        - expectedProtocolEpoch
        - expectedServerInstanceId
        - requestId
        - retryability
      properties:
        code:
          type: string
          enum: [accountFenceMismatch, protocolEpochMismatch, serverInstanceMismatch]
        expectedProtocolEpoch:
          type: integer
          const: 1
        expectedServerInstanceId:
          $ref: '#/components/schemas/ServerInstanceId'
        requestId:
          $ref: '#/components/schemas/LowercaseUuid'
        retryability:
          type: string
          const: afterBootstrap
    ClientUpgradeError:
