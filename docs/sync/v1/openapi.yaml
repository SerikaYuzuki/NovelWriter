  /v1/works/{workId}/divergences/{divergenceId}:classify:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/WorkIdPath'
      - $ref: '#/components/parameters/DivergenceIdPath'
    post:
      tags: [Divergence]
      operationId: classifyDivergence
      summary: Atomically apply deterministic auto-union or create a needs-choice Conflict.
      description: |
        Reconciliation is defined by the three complete manifests. The server validates
        the supplied classification against base/local/remote EntityKey-to-ObjectID
        maps. A `needsChoice` command contains no descriptor array: in
        serverReadableV1 the server deterministically computes, stores, sorts, and
        digests the complete immutable descriptor set, then returns only its count,
        digest, and bounded preview. Clients retrieve the complete set through the
        stable descriptor-page endpoint. Safe union requires a previously registered deterministic two-parent
        candidate whose sorted parent set is exactly the Divergence local candidate
        plus `expectedRemoteHead`, and whose entries are the exact three-manifest map
        union. The command seals `expectedRemoteHead`; validation, head CAS, Divergence
        resolution, change event, and receipt commit in one transaction. A moved head
        yields `stale` and does not reinterpret the union. Needs-choice creates the
        Conflict and receipt atomically. Applied safe union also creates exactly one
        `autoUnion` History occurrence and commits it with headChanged,
        divergenceChanged, snapshotRetentionChanged, and receipt. Needs-choice, stale,
        terminal error, and exact receipt replay create no head occurrence. The safe union and every needs-choice source
        must each satisfy dependency closure, portable v3 projection limits, and
        whole-work invariants; an invalid
        candidate is never classified into a head-capable state. Even when raw changed
        EntityKey sets are disjoint, an union that would violate a cross-key dependency
        whole-work invariant becomes a typed DependencyConflictDescriptor and
        `needsChoice`. An aggregate v3 projection overflow with no complete bounded key
        attribution becomes a typed PortableProjectionConflictDescriptor.
        Payload/string/order-array merge is never performed.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/ClassifyDivergenceCommand'
      responses:
