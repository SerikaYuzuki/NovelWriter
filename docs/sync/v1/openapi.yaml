  /v1/works/{workId}/head:publish:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/WorkIdPath'
    post:
      tags: [Heads]
      operationId: publishWorkHead
      summary: Advance a work head by expected-head CAS or preserve a Divergence.
      description: |
        In one PostgreSQL transaction the server replays or creates the operation
        receipt, locks current head, verifies manifest lineage and all finalized
        objects, updates head and change event when expected matches, or creates a
        Divergence and change event when it does not. The candidate is never deleted.
        A root publish has `expectedHead=null` and a zero-parent candidate. An ordinary
        non-root publish has exactly the expected SnapshotID as its sole parent. If the
        candidate is already current head, the outcome is `noOp`; otherwise an applied
        publish increments generation by exactly one and creates exactly one
        `published` History occurrence. The head row, occurrence, headChanged and
        snapshotRetentionChanged events, and receipt commit in that same transaction.
        `noOp`, `diverged`, terminal error, and exact receipt replay create no duplicate
        head occurrence.
        Snapshot content restore and Conflict resolution use their dedicated commands;
        ordinary publish remains the exact four-field sealed command frozen by the
        publish-command schema. A candidate must carry the server-readable v1 invariant
        attestation established at registration; publish rechecks protocol epoch,
        tenant, WorkID, object availability, and attestation before head use. In
        particular, every candidate's `work/document` ObjectID must exactly equal the
        WorkID anchor, including a parentless candidate sent against an existing Work;
        parented candidates also match every parent. A mismatch is `lineageViolation`
        and cannot become head.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/PublishHeadCommand'
      responses:
        '200':
          description: Receipt-replayable applied, no-op, or diverged domain result.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/PublishHeadResult'
        '400':
