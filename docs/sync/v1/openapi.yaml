  /v1/works/{workId}/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/WorkIdPath'
      - $ref: '#/components/parameters/SnapshotIdPath'
    put:
      tags: [Snapshots]
      operationId: registerSnapshot
      summary: Register one canonical immutable dense whole-work manifest.
      description: |
        Request bytes are the Snapshot manifest itself. `snapshotId` MUST equal the
        SHA-256 of these exact canonical bytes. The path WorkID MUST equal manifest
        WorkID. Every parent must already exist in the same tenant and WorkID; every
        entry object must already be finalized in the same tenant with exact byte size.
        Entry-declared content type is reference context, not CAS object identity. In
        serverReadableV1, each structured entry
        object must itself be exact JCS and pass the versioned schema selected by its
        EntityKey; attachment bytes remain opaque. Registration also validates the
        complete work dependency closure and whole-work invariants: order entities,
        chapter/episode ownership, referenced domain IDs, attachment metadata/bytes,
        and every required reachable entity must be internally consistent, with no
        dangling required reference and no typed domain entity outside the declared
        closure. Attachment display names and every projected package path pass the
        exact Unicode 15.1 portable name/path policy advertised by capabilities.
        The synchronized known model's exact v3 projection must also fit every portable
        package limit advertised by capabilities; JSON Schema maxima alone are not
        sufficient. The first accepted Snapshot for a previously unseen WorkID anchors
        its `work/document` ObjectID. Every later Snapshot under that WorkID, even a
        zero-parent migration candidate, MUST equal the anchor; a parented Snapshot
        also MUST equal every parent. Its `documentId` and canonical UTC-seconds
        `documentCreatedAt` therefore cannot be rewritten after Work creation.
        `documentCreatedAt` additionally requires calendar-valid RFC 3339 UTC whole-
        second parsing; regex acceptance alone is insufficient.
        A malformed payload is `schemaViolation`; a changed lineage value is
        `lineageViolation`. Invalid candidates are stored neither as valid
        Snapshots nor as heads. A future E2EE protocol must replace this validation
        contract under another namespace/epoch; v1 never skips it. Same ID + same
        bytes with a fully available entry-reference set is an idempotent existing
        result. If only retained lineage metadata remains, the same immutable manifest
        may re-materialize its entry map and references atomically after all objects are
        available; this never creates a different Snapshot identity. First
        materialization and explicit re-materialization quota-preflight the exact
        canonical manifest byte count, then add that count to
        usedCanonicalManifestBytes exactly once in the same all-or-none transaction.
        A response-loss repeat observes the available Snapshot, returns
        alreadyPresent with zero additional charge, and never charges the manifest
        twice. This explicit
        client registration is also the only v1 action that may clear a durable
        `userReleasedPayload` marker. Automatic bucket retention, maintenance, or
        History replay MUST NOT re-materialize a user-released payload. When explicit
        re-materialization clears that marker, available=true, the canonical manifest
        payload, all entry references, snapshotRetentionChanged, quotaChanged, and the
        exact manifest quota charge commit atomically. A failed quota preflight stores
        no payload/reference/availability transition.

        Registration runs in one database transaction. It locks every distinct
        referenced tenant/ObjectID lifecycle row in ObjectID byte order, serializing
        with the GC mark transaction, validates `available` rows, and inserts all Snapshot entry
        references before commit. A `quarantined` exact incarnation may be atomically
        rescued to `available` under that same lock. If GC already committed
        `deleting`, registration changes nothing and returns typed
        `objectAvailabilityChanged`; the exact request is not blindly retried. The
        client re-plans by querying missing objects, uploading/finalizing any absence,
        and then submits registration again. This all-or-none transaction prevents a
        manifest from committing references to an incarnation selected for deletion.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/SnapshotManifest'
      responses:
        '200':
          description: Stored or already-existing immutable manifest.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/RegisterSnapshotResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SnapshotRegistrationConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      summary: Get exact canonical manifest bytes.
      responses:
        '200':
          description: Exact bytes whose SHA-256 is the path SnapshotID.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/SnapshotManifest'
        '401':
