openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FUMINIWA Snapshot Sync API
  version: 1.0.0-r0-draft
  summary: Local-first immutable whole-work Snapshot replication protocol.
  x-fuminiwa-schema-equivalence:
    authority:
      PublishHeadCommand: ./publish-command.schema.json
      SnapshotManifest: ./snapshot.schema.json
    rule: |
      R0 validation MUST first recursively inline every local reference in both
      representations, then remove any `$defs` entries that are no longer referenced
      after complete inlining. It then removes JSON Schema annotation keys ($schema,
      $id, title, description, $comment), removes keys beginning `x-fuminiwa-`, sorts
      object keys and set-like required/enum arrays, and requires structural equality.
      Any difference fails R0. This embedded copy exists only to keep openapi.yaml
      usable as one self-contained OpenAPI file.
  description: |
    R0 design draft. This file is a wire-contract authority, not an implementation
    report. Rust server, SQLite client, migration, and Production deployment remain
    unimplemented until the corresponding gates pass.

    Protocol v1 is fixed to `contentProtectionProfile=serverReadableV1` and
    `e2ee=false`. TLS and server-managed encryption at rest are mandatory, but an
    authorized server operator and recovery backup can read manuscript content.
    E2EE is not a v1 capability toggle; adopting it requires a future incompatible
    namespace/epoch and migration.

    Production external identity v1 is Sign in with Apple native only, through the
    separate versioned FUMINIWA Auth API. This Sync API never accepts an Apple
    authorization code, identity/access/refresh token, subject, email, name, or relay
    address. `bearerAuth` is exclusively the short-lived opaque FUMINIWA access token
    issued by Auth v1. A fixed bearer token is a development-only out-of-band harness
    and is never a Production provider or advertised capability.

    Every JSON request and response uses the media type
    `application/vnd.fuminiwa.sync.v1+jcs` and MUST be the exact UTF-8 RFC 8785
    JSON Canonicalization Scheme (JCS) representation accepted by its closed
    schema. The server rejects non-canonical whitespace, escapes, number spelling,
    member ordering, duplicate members, unknown members, unsafe integers, invalid
    UTF-8, and unpaired surrogates. Strings are not Unicode-normalized and line
    endings are not rewritten. Arrays that are declared sorted are compared by
    UTF-8 bytes. A body that parses as equivalent JSON but is not exact JCS is an
    error; the server never canonicalizes and silently substitutes another ID.

    Every UUID-bearing sync wire field uses lowercase hyphenated RFC 9562 text. The
    `.novelpkg` v3 boundary has a different canonical spelling: its writer emits UUID
    JSON values and UUID-based filenames in uppercase. Import parses an accepted
    package UUID to its logical 128-bit value and serializes that value in lowercase
    for sync; Export parses the lowercase wire value and emits canonical uppercase
    package text. Letter case is never a new identity, but noncanonical case remains
    invalid on this wire. This boundary conversion does not rewrite arbitrary content.

    Every mutating command that contains `operationId` is receipt-idempotent. The
    server computes SHA-256 over the exact accepted canonical command bytes; no
    client-authoritative request-digest field or header exists. The first execution
    atomically stores the OpenAPI operationId (command kind), computed digest, HTTP
    status, and canonical response. Replaying the same tenant + operationId + command
    kind + exact command bytes returns the same status and body. Reusing an operationId
    at another command kind or with different accepted command bytes returns
    `operationIdReused`. A client SealedAttempt may keep its own digest only as a local
    integrity check.
    Receipt creation happens only after authentication, all tenant fences, media type,
    body cap, and exact-JCS/schema decoding succeed. Terminal command outcomes,
    including `stale`, semantic rejection, and quota rejection, are receipted. 401,
    fence/version failure, 429, 503, and transport failure do not consume operationId;
    the same exact command may be retried only according to typed retryability.

    The FUMINIWA access token resolves to `AuthenticatedPrincipal { AccountID,
    TenantID, SessionID, AccountAuthEpoch }` and selects exactly one tenant. No request body accepts
    an owner, account, or tenant identifier. Except for capabilities, authenticated
    calls also carry server-instance, protocol-epoch, account-fence, and client-
    version headers. A mismatch is rejected before object existence is revealed.
    IDs and object keys are unique only inside that authenticated tenant.
    When a closed command repeats an identifier from its route path, the values MUST
    be byte-for-byte equal; the repeated field is part of the sealed command digest.

    CAS mismatch is a successful preservation outcome, not transport failure:
    publish returns a persisted Divergence and keeps the candidate Snapshot. Server
    timestamps are display and operations metadata only; they never select a winner.

    Local source generation is intentionally not a wire field. Before sealing any
    local-origin head mutation (normal publish, safe auto-union classification,
    Conflict resolution, or restore), the client durably binds the operationId and
    canonical command to its source local generation inside SealedAttempt. On receipt
    or exact read-back, it may materialize remote head/base state, but may mark an
    Intent acknowledged or clear a local current candidate only if that same source
    generation is still current. A newer local generation remains the current draft
    and keeps or creates its own pending Intent; no successful remote operation may
    overwrite, materialize over, or clear edits created after its source fence.

    Remote work trash, work deletion, hard deletion, and client-requested object
    deletion are OUT of Snapshot Sync wire v1. The v1 server exposes no destructive
    work/object endpoint; policy-driven unreferenced-object retention GC remains an
    internal lifecycle and follows the incarnation fencing rules below. The sole
    quota-release command removes an unprotected Snapshot payload retention root while
    preserving its Work and lineage; it is not a Work/object delete API.
    Snapshot content restore remains supported only by registering a new two-parent
    Snapshot and sending the dedicated receipt-idempotent restore command; history is
    never rewound in place.

    ObjectID is SHA-256 of raw bytes only. CAS descriptors bind ObjectID to byteCount,
    never to media/content type. `contentType` belongs to each SnapshotEntry reference,
    so identical bytes may validly be used as an attachment and as a structured entity.
    Structured size, JCS, and entity-schema checks occur at Snapshot registration in
    that entry context.

    Server object retention uses a tenant-local two-phase GC lifecycle with logical
    rows in `available`, `quarantined`, or `deleting` state. ObjectID remains the
    bytes-only logical identity; each physical stored copy has a separate immutable,
    server-internal incarnation key that never appears on the wire. A GC deletion
    token is bound to exactly the old incarnation and cannot delete or update a newer
    incarnation adopted for the same ObjectID. GC first locks an unreferenced
    `available` row and marks it `quarantined`; after `objectGcGraceSeconds` it locks
    and rechecks references, rescues the row if it became referenced, or commits
    `deleting` with a token bound to that incarnation. Physical deletion and logical
    cleanup are conditional on the same token and incarnation. Snapshot registration,
    GC marking, and upload finalization serialize on the logical object lifecycle as
    specified by their operations. No GC state or physical key changes ObjectID
    semantics, and no destructive object endpoint is exposed.

    The structured `work/document` entity contains `documentId` and
    `documentCreatedAt`. The latter MUST be a calendar-valid RFC 3339 instant in the
    exact lexical form `YYYY-MM-DDTHH:MM:SSZ`: proleptic-Gregorian year 0001 through
    9999, a real month/day combination including leap-year rules, UTC `Z`, whole
    seconds, and no leap-second value. The timestamp pattern is only a lexical
    prefilter; every implementation MUST enable format assertion or perform an
    equivalent calendar-validating parse. Invalid dates are `schemaViolation`.
    The first accepted Snapshot registration for a previously unseen WorkID anchors
    its `work/document` ObjectID. Every later Snapshot registered under that WorkID,
    including a parentless migration/divergence candidate, MUST use the exact anchor;
    parented Snapshots additionally match every parent. Publish,
    classification, conflict resolution, and restore recheck that attestation before
    making a head. A malformed document object is `schemaViolation`; a well-formed
    but changed document ObjectID in an existing WorkID lineage is `lineageViolation`.
    A keep-both zero-parent root has a new WorkID and may reuse the original
    `work/document` object; the rule is lineage-scoped, not globally unique.

    Snapshot validity also requires the synchronized known model to project losslessly
    through the current `.novelpkg` v3 writer within the portable hard limits returned
    by capabilities. This whole-work check is authoritative beyond manifest JSON
    Schema and is separate from the 5 GiB online account quota. In particular, a
    server-valid Snapshot cannot contain a body, memo, world-note payload, attachment
    name, aggregate, or item count that the v3 Import/Export boundary cannot represent.
    The server validates the known synchronized model; each client additionally checks
    its local-only preserved-resource inventory before adopting an Export destination.
    Portable path comparison is fixed to Unicode 15.1.0 data and advertised artifact
    hashes; an OS locale, Foundation, .NET globalization, Rust standard library, or
    deployment ICU version is never the authority.

    Snapshot DAG lifetime is not depth-limited. `maxGraphTraversalNodesPerRequest` is
    only a resource budget for one ancestor traversal or graph query. Implementations
    use stored validation attestations, immediate-parent checks, indices, and stable
    pagination so an old, continuously edited Work never becomes unpublishable merely
    because its lineage is deep.
servers:
  - url: https://sync.invalid
    description: Placeholder only; a deployment supplies an authenticated HTTPS origin.
security:
  - bearerAuth: []
tags:
  - name: Protocol
  - name: Bootstrap
  - name: Changes
  - name: Objects
  - name: Snapshots
  - name: Heads
  - name: Divergence
  - name: Conflicts
  - name: History
  - name: Quota
paths:
  /v1/capabilities:
    get:
      tags: [Protocol]
      operationId: getCapabilities
      summary: Bind an authenticated client to the server instance, epoch, and account fence.
      description: |
        This is the only authenticated operation that does not require the three
        fence headers. It is still authorized by a FUMINIWA access token. The response
        binds its AccountID and AccountAuthEpoch to an opaque account fence. Ordinary
        access/refresh rotation and same-identity reauthentication keep this fence;
        a security-scope epoch change requires quarantine and full bootstrap.
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Exact protocol capabilities for this principal.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/bootstrap:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
    post:
      tags: [Bootstrap]
      operationId: startBootstrap
      summary: Create a stable library view and its change-log barrier.
      description: |
        The returned barrier cursor denotes the commit boundary at which the stable
        multi-collection view was created. The client stages every Library page first.
        For every barrier Work it then stages all pages of `state=open` Divergences,
        `state=needsChoice` Conflicts, and retained History occurrences with pin,
        availability, and userReleasedPayload, always passing this bootstrapId. Those list pages read the same
        barrier even while current state changes.

        Every mutation committed after the barrier that can affect library head,
        Divergence, Conflict, History occurrence, pin, or availability MUST append the
        corresponding headChanged, divergenceChanged, conflictChanged, or
        snapshotRetentionChanged event after the barrier cursor in the same database
        transaction. Checkpoint record, normal/auto-union/conflict/restore head
        occurrence creation, pin, payload release, and restore-before protection are
        included. A first publish after the barrier emits headChanged so a new Work not
        present in the barrier Library is discovered.

        Only after every barrier page is staged does the client pull changes strictly
        after barrierCursor to a current cursor, replaying commit order. Each event
        triggers refetch of the exact current Work head or complete current Work
        review/history collection, then upsert/removal; eventId and occurrenceId
        deduplicate at-least-once delivery. The client atomically installs Library,
        reviews, History, retention state, and final cursor into SQLite only after all
        refetches succeed. Crash, expired cursor/bootstrap, invalid/mismatched page
        token, or any partial scan installs nothing and restarts from startBootstrap.
        A repeated call creates another independent stable view and changes no data.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/BootstrapCommand'
      responses:
        '200':
          description: Bootstrap session, barrier, and first stable library page.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/FenceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/bootstrap/{bootstrapId}/library/{pageToken}:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/BootstrapIdPath'
      - $ref: '#/components/parameters/PageTokenPath'
    get:
      tags: [Bootstrap]
      operationId: getBootstrapLibraryPage
      summary: Continue a stable bootstrap library view.
      description: |
        `pageToken` MUST be the unmodified token returned by the immediately previous
        page of this bootstrap. Tokens are account-, instance-, epoch-, and session-
        bound. Pages are stable for the advertised session lifetime. A missing,
        duplicated, skipped, expired, or cross-session token invalidates the staged
        bootstrap; the client discards it rather than installing a partial Library.
      responses:
        '200':
          description: Next stable page.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/changes:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
    get:
      tags: [Changes]
      operationId: getChanges
      summary: Pull tenant changes strictly after an opaque cursor.
      description: |
        Delivery is at-least-once and commit-ordered. `afterCursor` is exclusive.
        The page and its `nextCursor` describe one stable prefix. The client MUST
        persist all events and `nextCursor` in one local transaction before advancing.
        An expired cursor returns `cursorExpired`; the client keeps local current,
        Intent, Attempt, and Conflict state and performs a new full bootstrap.

        During bootstrap catch-up, events are replayed after the barrier in commit
        order. headChanged refetches the current head and upserts even a Work absent
        from the barrier Library. divergenceChanged and conflictChanged refetch their
        complete current open/needsChoice Work collections and remove records no longer
        present. snapshotRetentionChanged refetches the complete current retained
        History collection and replaces pin/availability/user-release/occurrence state using
        occurrenceId for deduplication. quotaChanged refetches quota. The final cursor
        is installed atomically with the staged Library/review/History state; no event
        page alone makes a partial bootstrap visible.
      parameters:
        - $ref: '#/components/parameters/AfterCursor'
        - $ref: '#/components/parameters/ChangeLimit'
      responses:
        '200':
          description: Stable change page. Empty pages are valid and still return a cursor.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/FenceConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/objects/missing:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
    post:
      tags: [Objects]
      operationId: findMissingObjects
      summary: Determine which object descriptors are absent in this tenant.
      description: |
        Object existence is never compared across tenants. Presence is authoritative
        only for the authenticated server-instance/protocol-epoch/account fence. A
        present ObjectID with a different supplied byteCount is
        `objectDescriptorMismatch`, never silently treated as present. Clients may
        cache verified presence only under that complete immutable binding scope.
        Only an `available` logical object row is reported present. This answer is a
        transfer-planning observation, not a reservation: GC may later quarantine or
        mark an unreferenced object deleting. Snapshot registration is the atomic
        authority and may therefore return `objectAvailabilityChanged` even after a
        present result.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/MissingObjectsCommand'
      responses:
        '200':
          description: Missing and present IDs, each sorted by lowercase digest bytes.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/MissingObjectsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/FenceConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/object-uploads:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
    post:
      tags: [Objects]
      operationId: createObjectUpload
      summary: Create a tenant-scoped temporary upload or confirm that the object exists.
      description: |
        This is a receipt-idempotent sealed command. Exact replay always returns its
        original `uploadId` and `expiresAt` (or `alreadyPresent`) and never rotates an
        expired session behind the same operationId. A client retires an expired child
        transfer only after typed `uploadExpired`, rechecks current-scope presence, and
        seals a new create command with a new operationId. `alreadyPresent` means an
        `available` logical object row at the first receipt transaction; an exact
        receipt replay is historical and does not re-observe or resurrect the object.
        The receipt does not reserve it against a later unreferenced-object GC
        transition.

        For a new upload, one PostgreSQL transaction reserves exactly object.byteCount,
        creates the upload row in `open`, emits quotaChanged, and stores the create
        receipt. Receipt replay, including after that upload later becomes `expired`,
        returns the same uploadId/expiresAt and never reserves bytes again. The expiry
        worker and finalize serialize on that upload row. Expiry CASes `open` to
        `expired`, releases its reserved bytes exactly once, and commits a durable
        temporary-object cleanup intent plus quotaChanged event in one transaction.
        Cleanup resumes after crash; storage delete failure never restores a reservation.
        Multiple open upload rows for the same tenant/ObjectID are permitted and each
        has its own exact reservation. They are never silently made to share an
        uploadId; finalize deduplicates their eventual CAS charge under the
        tenant/ObjectID lifecycle lock as specified below.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/CreateObjectUploadCommand'
      responses:
        '200':
          description: Receipt-replayable upload creation result.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/CreateObjectUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/object-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/UploadIdPath'
    put:
      tags: [Objects]
      operationId: uploadObjectBytes
      summary: Replace the temporary upload body with one complete byte stream.
      description: |
        The server streams without buffering the complete object in process memory.
        Each PUT writes a new staging body and only atomically replaces the upload's
        complete temporary body after the exact declared byte count is durably accepted.
        An interrupted request leaves any prior complete body unchanged (or leaves the
        upload without one). Before finalize, another complete PUT to the same open
        upload replaces temporary bytes. Once finalized, PUT is rejected.
        `Content-Length` MUST equal the descriptor byte count reserved at creation.
        Chunked transfer and a missing, duplicated, malformed, or out-of-range
        Content-Length are rejected as `invalidRequest`; finalize still re-reads the
        stored byte count and hash rather than trusting the header. When the temporary
        session is expired, the server returns typed `uploadExpired`; the old uploadId
        is never reopened and its reservation has already been released exactly once.
        A complete PUT has no operation receipt and may be resent in
        full only while that same uploadId remains open.
      parameters:
        - $ref: '#/components/parameters/UploadContentLength'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Temporary bytes accepted; this is not final object availability.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/UploadBytesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/object-uploads/{uploadId}:finalize:
    parameters:
      - $ref: '#/components/parameters/ServerInstanceFence'
      - $ref: '#/components/parameters/ProtocolEpochFence'
      - $ref: '#/components/parameters/AccountFence'
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/UploadIdPath'
    post:
      tags: [Objects]
      operationId: finalizeObjectUpload
      summary: Verify temporary object bytes and atomically adopt them into tenant CAS.
      description: |
        The server re-reads actual stored bytes, verifies SHA-256 and byte count, then
        adopts under a tenant-prefixed physical incarnation key. S3 ETag and client
        metadata are not accepted as hash evidence. The physical key is immutable,
        server-internal, and distinct from bytes-only ObjectID. Every finalize acquires
        locks in the fixed global order tenant/ObjectID lifecycle row, then its upload
        row; no path acquires those two locks in reverse. Concurrent finalizes for the
        same ObjectID therefore serialize before CAS adoption. Finalize may reuse or rescue an exact
        verified available/quarantined incarnation; if an old incarnation is already
        deleting, finalization observes that deletion's completion and adopts the
        verified upload as a fresh incarnation. The old GC token names only its old
        incarnation key, so it can neither delete the fresh bytes nor clear the fresh
        logical mapping. The upload row durably fixes one planned immutable incarnation
        key before physical adoption. The server streams and read-backs that exact
        physical object for hash and byte count; only then does one PostgreSQL
        transaction handle one of two success dispositions. The first valid finalize
        that observes no current available incarnation marks its planned incarnation
        `available`, converts exactly its reservation to used quota, publishes current
        binding-scope presence, finalizes the upload with outcome `finalized`, emits
        quotaChanged, and stores the success receipt. A later valid finalize for the
        same ObjectID read-backs the already-available incarnation's hash and size
        while holding the lifecycle lock, leaves used quota unchanged, changes its own
        upload to finalized, releases its own reservation exactly once, records cleanup
        intent for its unused temporary/planned bytes, emits quotaChanged, and stores
        outcome `alreadyAvailable` plus the receipt in one transaction. Thus one
        tenant/ObjectID is charged once regardless of concurrent upload count. A crash
        before that transaction reuses and re-verifies the
        same planned key; it neither allocates a second charge nor trusts an orphan. A
        crash after commit replays the receipt without storage mutation. Unreferenced
        physical orphans are swept only by incarnation-key fencing after grace.
        Only finalized `available` objects may be referenced by a registered Snapshot.
        Finalize is a receipt-idempotent sealed command. Its first
        terminal `uploadExpired` result is receipted, so exact same-operation replay
        remains expired; the typed recovery action authorizes a separate new create
        operation, not mutation of the finalized command. A success establishes remote
        presence only at the first execution and only in the current
        server/epoch/account binding scope. Exact receipt replay does not extend
        retention or resurrect bytes; missing-object planning and registration remain
        the current-availability authorities. A missing,
        wrong-size, or wrong-hash complete body is likewise a terminal receipted
        `FinalizeObjectRejectedError`. Under the same lifecycle-then-upload lock order,
        an open row becomes terminal `expired` with internal cause validationRejected;
        its reservation is released exactly once and cleanup intent, quotaChanged, and
        the error receipt commit atomically. It cannot hold quota until the scheduled
        expiry. The client rechecks presence and creates a replacement upload with a
        new operationId rather than changing the old command or body.

        Finalize and expiry take the same upload-row lock/CAS. If finalize wins from
        `open`, its PostgreSQL transaction changes the row to `finalized`, either
        converts the reservation for the sole adopted incarnation or releases it for
        an already-available duplicate, publishes scoped presence, emits quotaChanged,
        and stores the receipt atomically; expiry later is a no-op. If expiry wins,
        finalize returns terminal typed uploadExpired, and a replacement create command
        makes a new row and new reservation under a new operationId.
      requestBody:
        required: true
        content:
          application/vnd.fuminiwa.sync.v1+jcs:
            schema:
              $ref: '#/components/schemas/FinalizeObjectUploadCommand'
      responses:
        '200':
          description: Receipt-replayable finalization result.
          content:
            application/vnd.fuminiwa.sync.v1+jcs:
              schema:
                $ref: '#/components/schemas/FinalizeObjectUploadResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
