        reason:
          type: string
          const: portableProjectionLimitExceeded
      description: |
        Bounded whole-work marker used when a safe union of individually valid source
        Snapshots exceeds one portable v3 projection limit and no complete causal key
        set of at most four entries exists. It intentionally carries no incomplete
        affected-key list; the immutable source manifests remain available for review.
