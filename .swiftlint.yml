# FUMINIWA — SwiftLint 設定
#
# D-076 R1: 通常App／iOS／各test targetまで同じ入口で検査する。
# 既存違反は .swiftlint.baseline.yml に固定し、新規違反だけをゲートする。
# opt-in ruleの大量追加やSwiftFormatとの重複は避け、分割・責務抽出のPRで
# baselineを小さくする。
# baselineのlocationはcheckout間で再利用できるrepo-relative pathに保つ。

included:
  - NovelKit/Sources
  - NovelKit/Tests
  - NovelApp
  - NovelAppIOS
  - NovelAppTests
  - NovelAppIOSTests

excluded:
  - NovelKit/.build
  - NovelKit/.swiftpm
  - .derivedData
  - .build
  - "NovelApp 20*"
  - NovelApp/Assets.xcassets
  - NovelApp/en.lproj
  - NovelApp/ja.lproj
  - NovelAppIOS/Info.plist
  - NovelAppIOS/*.entitlements

reporter: "xcode"
